[package]
name = "tray-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "A small CLI/background utility with a system tray icon and cross-platform auto-start."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["tray", "cli", "autostart", "desktop", "utility"]
categories = ["command-line-utilities", "gui"]

[lib]
name = "tray_cli"
path = "src/lib.rs"

[[bin]]
name = "tray-cli"
path = "src/main.rs"

[dependencies]
auto-launch = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
muda = "0.21.2"
ratatui = "0.30.2"
single-instance = "0.3.3"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26.1"
winit = "0.30.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
