# Workspace root.
#
#   trayforge      — the reusable library (no clap, no ratatui)
#   trayforge-cli  — the application: clap command surface + ratatui dashboard
#
# Keeping the library free of presentation dependencies is what makes it
# reusable: other front-ends (a GUI, a service, another CLI) can depend on
# `trayforge` without dragging a terminal toolkit along.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
keywords = ["tray", "cli", "autostart", "desktop", "utility"]
categories = ["command-line-utilities", "gui"]

[workspace.dependencies]
# Shared third-party crates, pinned in exactly one place.
auto-launch = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
muda = "0.21.2"
ratatui = "0.30.2"
single-instance = "0.3.3"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26.1"
winit = "0.30.13"

# Intra-workspace dependency. The `version` is what gets published; the `path`
# is what is used locally.
trayforge = { version = "0.1.0", path = "crates/trayforge" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
